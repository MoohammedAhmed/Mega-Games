<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - الصفحة غير موجودة | Mega Games</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .error-page-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .error-code {
            font-family: 'Orbitron', sans-serif;
            font-size: 10rem;
            font-weight: 900;
            line-height: 1;
            color: transparent;
            -webkit-text-stroke: 2px var(--neon-blue);
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            margin-bottom: 20px;
            animation: glitch 3s infinite;
        }

        .error-message h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #fff;
        }

        .error-message p {
            color: #aaa;
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 30px;
            line-height: 1.8;
        }

        .back-home-btn {
            display: inline-block;
            padding: 15px 40px;
            background: transparent;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }

        .back-home-btn:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 30px var(--neon-green);
            transform: scale(1.05);
        }

        /* أنيميشن الجلتش للرقم 404 */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 5px); }
            40% { transform: translate(-5px, -5px); }
            60% { transform: translate(5px, 5px); }
            80% { transform: translate(5px, -5px); }
            100% { transform: translate(0); }
        }

        .broken-joystick {
            font-size: 5rem;
            margin-bottom: 20px;
            display: block;
        }
    </style>
</head>
<body>
    <main class="error-page-wrapper">
        <div class="error-code">404</div>
        <div class="broken-joystick">🎮⚠️</div>
        <div class="error-message">
            <h1>يا زميلي إنت دخلت في حيطة!</h1>
            <p>الصفحة اللي بتدور عليها غالباً عملت Respawn في مكان تاني أو الكيبل بتاعها اتقطع. ارجع للرئيسية بدل ما الجهاز يفرقع في وشنا.</p>
            <a href="index.html" class="back-home-btn">العودة للمهمة الرئيسية</a>
        </div>
    </main>

    <script src="components.js"></script>
    <script src="script.js"></script>
</body>
</html>
