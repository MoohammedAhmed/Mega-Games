<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGA GAMES | بوابة الوصول</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    
    <canvas id="tronGridCanvas"></canvas>
    <div class="grid-overlay"></div>

    <div class="auth-container">
        <div class="auth-card">
            
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" data-tab="login">تسجيل الدخول</button>
                <button type="button" class="auth-tab" data-tab="register">إنشاء حساب</button>
            </div>

            <form id="loginForm" class="auth-form active">
                <div class="input-group">
                    <input type="email" id="loginEmail" placeholder="البريد الإلكتروني للـ Gamer" required>
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="input-group">
                    <input type="password" id="loginPassword" placeholder="كلمة المرور" required>
                    <i class="fas fa-lock"></i>
                </div>
                <button type="submit" class="auth-btn">دخول القاعدة // LOGIN</button>

                <div class="social-auth-container">
                    <div class="social-divider">
                        <span>أو الدخول بواسطة // OAUTH</span>
                    </div>
                    <div class="social-buttons">
                        <button type="button" class="social-btn google" title="تسجيل بواسطة Gmail">
                            <i class="fab fa-google"></i>
                        </button>
                        <button type="button" class="social-btn facebook" title="تسجيل بواسطة Facebook">
                            <i class="fab fa-facebook-f"></i>
                        </button>
                        <button type="button" class="social-btn twitter-x" title="تسجيل بواسطة X">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display: inline-block; vertical-align: middle;">
                                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="auth-footer-links">
                    <a href="#">هل نسيت كلمة المرور؟</a>
                </div>
            </form>

            <form id="registerForm" class="auth-form">
                <div class="input-group">
                    <input type="text" id="regUsername" placeholder="اسم المستخدم (Gamer ID)" required>
                    <i class="fas fa-user"></i>
                </div>
                <div class="input-group">
                    <input type="email" id="regEmail" placeholder="البريد الإلكتروني المعتمد" required>
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="input-group">
                    <input type="password" id="regPassword" placeholder="كلمة مرور قوية" required>
                    <i class="fas fa-lock"></i>
                </div>
                <button type="submit" class="auth-btn">دخول القاعدة // LOGIN</button>

               <div class="social-auth-container">
                    <div class="social-divider">
                        <span>أو الدخول بواسطة // OAUTH</span>
                    </div>
                    <div class="social-buttons">
                        <button type="button" class="social-btn google" title="تسجيل بواسطة Gmail">
                            <i class="fab fa-google"></i>
                        </button>
                        <button type="button" class="social-btn facebook" title="تسجيل بواسطة Facebook">
                            <i class="fab fa-facebook-f"></i>
                        </button>
                        <button type="button" class="social-btn twitter-x" title="تسجيل بواسطة X">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display: inline-block; vertical-align: middle;">
                                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

            </form>

        </div>
    </div>

    <script src="components.js"></script>
    <script src="script.js"></script>
</body>
</html>
