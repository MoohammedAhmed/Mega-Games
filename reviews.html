<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز مراجعات MEGA GAMES</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="grid-overlay"></div>

    <div class="hub-container">
        <header class="hub-header">
            <h1>مركز المراجعات<span>// DYNAMIC_HUB</span></h1>
            <p style="color: #555;">استكشف أحدث نتائج الاختبارات الميدانية لأقوى قطع الهاردوير.</p>
        </header>

        <nav class="filter-bar">
            <button class="filter-btn active" data-cat="all">الكل</button>
            <button class="filter-btn" data-cat="gpu"><i class="fas fa-microchip"></i> كروت شاشة</button>
            <button class="filter-btn" data-cat="cpu"><i class="fas fa-memory"></i> معالجات</button>
            <button class="filter-btn" data-cat="builds"><i class="fas fa-desktop"></i> تجميعات</button>
        </nav>

        <div id="articles-grid" class="articles-grid">
            </div>
    </div>
    <script src="components.js"></script>
    <script src="script.js"></script>

</body>
</html>
